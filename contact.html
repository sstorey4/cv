<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Samuel Storey</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-inner">
            <a href="index.html" class="nav-brand">Samuel Storey</a>
            <div class="nav-links">
                <a href="index.html">CV</a>
                <a href="contact.html" class="active">Contact</a>
            </div>
        </div>
    </nav>

    <main class="main-container narrow">
        <header class="page-header">
            <p class="eyebrow">Get in touch</p>
            <h1>Contact</h1>
            <p>For research collaboration or other inquiries, send a message below or email <a href="mailto:sstorey4@vols.utk.edu">sstorey4@vols.utk.edu</a>.</p>
        </header>

        <form action="https://formsubmit.co/eee5e9a984453efbf61601e114a0be1f" method="POST" class="contact-form">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="Name" placeholder="Your name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" placeholder="How can I help?" required></textarea>
            </div>

            <button class="btn submit-btn" type="submit">Send Message</button>

            <input type="hidden" name="_next" value="https://sts99340.github.io/thankyou.html">
        </form>
    </main>

    <footer>
        <div class="footer-content">
            <span>&copy; 2026 Samuel Storey</span>
            <div class="footer-links">
                <a href="https://linkedin.com/in/samuel-storey-569220298/" target="_blank" rel="noopener" class="footer-link"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>
                <a href="https://github.com/sstorey4" target="_blank" rel="noopener" class="footer-link"><i class="fa-brands fa-github"></i> GitHub</a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
